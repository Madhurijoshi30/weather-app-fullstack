version: "3.9"
 
# ── What this file does ───────────────────────────────────────────────────────
# Runs all 3 services locally with one command: docker-compose up --build
# Production is deployed on Vercel (frontend) and Render (backend)
# MongoDB Atlas is used in production — local mongo is for development only
 
services:
 
  # ── MongoDB (local development only) ──────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: weather_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Persists MongoDB data even if container is removed
      - mongo_data:/data/db
    networks:
      - weather_network
 
  # ── Backend: Node.js + Express ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: weather_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # For local Docker use — production uses MongoDB Atlas via Render env vars
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    depends_on:
      - mongo
    networks:
      - weather_network
 
  # ── Frontend: React + Vite built and served by Nginx ──────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Passes your Render backend URL into the Vite build
        - VITE_API_URL=${VITE_API_URL}
    container_name: weather_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - weather_network
 
networks:
  weather_network:
    driver: bridge
 
volumes:
  mongo_data: